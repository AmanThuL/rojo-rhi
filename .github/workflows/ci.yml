name: CI
on:
  push: {branches: [main]}
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The Null backend, which needs no GPU: the build and the contract cases on each hosted OS.
  null:
    strategy: {fail-fast: false, matrix: {os: [macos-26, windows-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'macOS'
        run: brew install xmake
      - if: runner.os == 'Windows'
        uses: xmake-io/github-action-setup-xmake@v1
        with: {xmake-version: latest}
      - uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xmake/setup.lua') }}
      # The layout rule runs `python3`; setup-python on Windows installs only `python.exe`,
      # so a python3 copy is added beside it when the runner has none.
      - if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command python3 -ErrorAction SilentlyContinue)) {
            $python = (Get-Command python).Source
            Copy-Item $python (Join-Path (Split-Path $python) 'python3.exe')
          }
          python3 --version
      - run: xmake setup
      # The macOS build packages Metal shader libraries, which need the Metal toolchain some hosted images lack.
      - if: runner.os == 'macOS'
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - run: xmake f -m debug -y --rojorhi_backend=null
      - run: xmake build RojoRHITests
      - run: xmake test RojoRHITests/contract
  # The Metal 4 backend compiles on hosted macOS; the runners have no Metal 4 device, so nothing runs.
  metal4:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: brew install xmake
      - uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xmake/setup.lua') }}
      - run: xmake setup
      - run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - run: xmake f -m debug -y --rojorhi_backend=metal4
      - run: xmake -y
      - run: xmake build RojoRHITests
