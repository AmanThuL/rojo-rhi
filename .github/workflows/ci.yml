name: CI
on:
  push: {branches: [main]}
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Project policy
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: |
          if [[ -n "$RANGE" ]]; then python3 Tools/check_project_policy.py --commits "$RANGE"
          else python3 Tools/check_project_policy.py; fi
      - run: python3 Tools/check_shader_imports.py
      - run: python3 Tools/check_spec.py
      - run: python3 Tools/check_vu_coverage.py
      - run: python3 -m unittest discover -s Tools/tests -v
      - run: python3 Tools/Rename/apply.py --selftest && python3 -m unittest discover -s Tools/Extract -p 'test_*.py'
  metal4:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: brew install xmake
      - uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xmake/setup.lua') }}
      - run: xmake setup
      # The metal4 backend compiles its own kernels, so its build needs the Metal toolchain some hosted images lack.
      - run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      # A configure with no backend flag selects metal4 on macOS; the configuration file records the resolved value.
      - run: |
          xmake f -c -m debug -y --ccache=n
          grep -q '^ *rojorhi_backend = "metal4"' .xmake/*/*/xmake.conf
      - run: xmake f -m debug -y --rojorhi_backend=metal4 --ccache=n
      # The plain build: the targets a host's own build builds, the library and the ImGui adapter.
      - run: xmake -y
      - run: xmake build RojoRHITests
      # Lists the cases of each tag and requires a floor, 169 for conformance so a dropped file fails;
      # no GPU case runs in this job.
      - run: |
          for tag in conformance contract metal4 imgui; do
            floor=1
            if test "$tag" = conformance; then floor=169; fi
            if test "$tag" = imgui; then floor=12; fi
            n=$(./build/macosx/arm64/debug/rojorhi-test/RojoRHITests --list-tests "[$tag]" | \
              sed -n 's/^\([0-9][0-9]*\) matching test cases$/\1/p')
            test -n "$n" && test "$n" -ge "$floor"
          done
      # Release must build warning-free.
      - run: xmake f -m release -y --rojorhi_backend=metal4 --ccache=n && xmake build RojoRHITests
  interface:
    strategy: {fail-fast: false, matrix: {os: [macos-26, windows-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'macOS'
        run: brew install xmake
      - if: runner.os == 'Windows'
        uses: xmake-io/github-action-setup-xmake@v1
        with: {xmake-version: latest}
      - uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xmake/setup.lua') }}
      # The layout rule runs `python3`; setup-python on Windows installs only `python.exe`,
      # so a python3 copy is added beside it when the runner has none.
      - if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command python3 -ErrorAction SilentlyContinue)) {
            $python = (Get-Command python).Source
            Copy-Item $python (Join-Path (Split-Path $python) 'python3.exe')
          }
          python3 --version
      # DXIL needs dxcompiler.dll and dxil.dll on the loader path; the Windows SDK ships both.
      # Without them the shader rule skips DXIL and says so, and the check_dxil step below fails the job.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $dir = Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64' } |
            Where-Object { (Test-Path (Join-Path $_ 'dxcompiler.dll')) -and (Test-Path (Join-Path $_ 'dxil.dll')) } |
            Select-Object -First 1
          if ($dir) {
            Add-Content $env:GITHUB_PATH $dir
            Write-Host "DXIL runtime on PATH: $dir"
          } else {
            Write-Host '::notice::dxcompiler.dll and dxil.dll not found in the Windows SDK; DXIL will be skipped'
          }
      - run: xmake setup
      # The shader rule's fixtures run xmake on a mock compiler, so they skip in the policy job, which has no xmake.
      - if: runner.os == 'macOS'
        run: python3 -m unittest Tools.tests.test_slang_rule -v
      # Some hosted images ship Xcode without the Metal toolchain the metallibs and shader libraries need.
      - if: runner.os == 'macOS'
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      # A configure with no backend flag selects null off macOS (is_host in xmake/targets.lua).
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          xmake f -c -m debug -y
          if (-not (Select-String -Path '.xmake/*/*/xmake.conf' -Pattern '^\s*rojorhi_backend = "null"')) { throw 'the default backend is not null' }
      - run: xmake f -m debug -y --rojorhi_backend=null
      - run: xmake build RojoRHITests
      # Without the Metal toolchain the build skips packaging and the shader library cases skip too,
      # so hosted macOS fails here instead of passing with nothing packaged.
      - if: runner.os == 'macOS'
        run: |
          header=$(find build -name ShaderList.h -path '*/rojorhi/*' | head -n 1)
          if [ -z "$header" ]; then echo "::error::no generated ShaderList.h under build/"; exit 1; fi
          if ! grep -q 'kMetalLibrariesBuilt = true;' "$header"; then
            echo "::error::$header says the Metal shader libraries were not built"; exit 1
          fi
      - run: xmake test RojoRHITests/contract
      - run: xmake test RojoRHITests/death
      - run: xmake test RojoRHITests/abi
      - run: xmake test RojoRHITests/imgui
      # The DXIL of the module's heap fetches and raw accesses; the check fails, rather than skips,
      # when the build compiled no DXIL.
      - if: runner.os == 'Windows'
        run: python3 Tools/check_dxil.py
      # The benchmark harness builds on macOS only; hosted runners have no Metal 4, so its GPU cases are counted.
      - if: runner.os == 'macOS'
        run: xmake build RojoRHIBench && xmake test RojoRHIBench/null
      - if: runner.os == 'macOS'
        run: |
          n=$(./build/macosx/arm64/debug/rojorhi-bench/RojoRHIBench check --list-tests "[native]" | \
            sed -n 's/^\([0-9][0-9]*\) matching test cases$/\1/p')
          test -n "$n" && test "$n" -gt 0
      - run: xmake f -m release -y --rojorhi_backend=null
      - run: xmake build RojoRHITests
      - run: xmake test RojoRHITests/contract
      - run: xmake test RojoRHITests/imgui
      - if: runner.os == 'macOS'
        run: xmake build RojoRHIBench && xmake test RojoRHIBench/null
      # Release links with LTO (ADR 0012); the probe shows a library entry inlined into its caller.
      - run: xmake build RojoRHILtoProbe && xmake run RojoRHILtoProbe
      - run: python3 Tools/check_lto_inline.py
  # The validation tracker's hidden stress cases under MSVC AddressSanitizer, which stands in for ThreadSanitizer there:
  # a long frame loop and every queue submitting from its own thread, Null backend, Debug so validation is on.
  tracker-stress:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: xmake-io/github-action-setup-xmake@v1
        with: {xmake-version: latest}
      - uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xmake/setup.lua') }}
      # The layout rule runs `python3`; setup-python on Windows installs only `python.exe`,
      # so a python3 copy is added beside it when the runner has none.
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - shell: pwsh
        run: |
          if (-not (Get-Command python3 -ErrorAction SilentlyContinue)) {
            $python = (Get-Command python).Source
            Copy-Item $python (Join-Path (Split-Path $python) 'python3.exe')
          }
          python3 --version
      - run: xmake setup
      - uses: ilammy/msvc-dev-cmd@v1
      # Only the project's targets are instrumented: the packages stay as they are, so the STL container annotations that
      # AddressSanitizer turns on are disabled on the targets to match them (the linker refuses mixed annotation settings).
      # The developer environment puts the AddressSanitizer runtime DLL on PATH.
      - shell: pwsh
        run: >
          xmake f -m debug -y --rojorhi_backend=null
          '--cxflags=-fsanitize=address -D_DISABLE_STRING_ANNOTATION -D_DISABLE_VECTOR_ANNOTATION -D_DISABLE_OPTIONAL_ANNOTATION'
          '--ldflags=-INCREMENTAL:NO'
      - run: xmake build RojoRHITests
      # The executable must import the AddressSanitizer runtime, or the run would pass uninstrumented.
      - shell: pwsh
        working-directory: build/windows/x64/debug/rojorhi-test
        run: |
          $out = dumpbin /dependents RojoRHITests.exe | Out-String
          if ($out -notmatch '(?i)clang_rt\.asan[\w-]*\.dll') { Write-Host $out; throw 'RojoRHITests.exe does not import the AddressSanitizer runtime' }
      # Both stress cases must be listed, or a skipped build would pass with nothing run.
      - shell: pwsh
        working-directory: build/windows/x64/debug/rojorhi-test
        run: |
          $out = .\RojoRHITests.exe --list-tests "[stress]" | Out-String
          if ($out -notmatch '(?m)^2 matching test cases') { Write-Host $out; throw 'expected 2 [stress] cases' }
      - shell: pwsh
        working-directory: build/windows/x64/debug/rojorhi-test
        run: |
          .\RojoRHITests.exe "[stress]" --durations yes
          if ($LASTEXITCODE -ne 0) { throw "stress cases exited with $LASTEXITCODE" }
  # ADR 0012: what including the public header costs a translation unit, against a stored baseline.
  header-cost:
    strategy: {fail-fast: false, matrix: {os: [macos-26, windows-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: python3 Tools/header_compile_time.py
        shell: bash
  format:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: brew install xmake clang-format
      - uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xmake/setup.lua') }}
      - run: xmake setup
      - run: xmake f -m release -y --ccache=n --rojorhi_backend=null && xmake project -k compile_commands build/compile-commands/null
      - run: xmake format --check
      - run: xmake f -m release -y --ccache=n --rojorhi_backend=metal4 && xmake project -k compile_commands build/compile-commands/metal4
      - run: xmake format --check
      - run: python3 Tools/check_rhi_headers.py
      # The D3D12 sources are compiled and checked on Windows (the d3d12-build job); keep the directories equal to the ones it checks there.
      - run: |
          python3 Tools/check_cpp_layout.py --compile-commands build/compile-commands/null/compile_commands.json \
              --compile-commands build/compile-commands/metal4/compile_commands.json \
              --exclude Backends/D3D12 --exclude Tests/D3D12 --exclude Tests/Support/D3D12 --exclude Tools/D3D12Probe \
              --exclude Benchmarks/HostWindows --exclude Benchmarks/NativeD3D12 --exclude Benchmarks/ChecksD3D12
      - run: python3 Tools/check_cpp_comments.py --public-api-docs error --compile-commands build/compile-commands/null/compile_commands.json
      - run: python3 Tools/check_cpp_comments.py --public-api-docs error --compile-commands build/compile-commands/metal4/compile_commands.json
  # The D3D12 backend, its tests, the floor probes and the benchmark harness, compiled in Debug and Release
  # and checked statically (DXIL and source layout). It executes nothing on D3D12 (ADR 0027).
  d3d12-build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: xmake-io/github-action-setup-xmake@v1
        with: {xmake-version: latest}
      - uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xmake/setup.lua') }}
      # The shader and layout rules run `python3`; setup-python on Windows installs only `python.exe`.
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - shell: pwsh
        run: |
          if (-not (Get-Command python3 -ErrorAction SilentlyContinue)) {
            $python = (Get-Command python).Source
            Copy-Item $python (Join-Path (Split-Path $python) 'python3.exe')
          }
          python3 --version
      - run: xmake setup
      - run: xmake f -m debug -y --rojorhi_backend=d3d12 --rojorhi_d3d12_debug=layer
      - run: xmake build RojoRHITests
      - run: xmake build RojoRHIBench
      - run: xmake build RojoRHID3D12ProbeFactory
      - run: xmake build RojoRHID3D12ProbeExports
      # Every conformance shader has DXIL (the layout probe is no conformance shader: xmake/slang.lua
      # leaves slang.layout_probe files out of the shaders it compiles). The check is per source file, best effort for
      # shaders with several entries: <name>.dxil, or <name>.<entry>.dxil for each entry of several. Each shader
      # also has its <name>.d3d12lib.
      - shell: pwsh
        run: |
          $out = 'build/windows/x64/debug/rojorhi-test/Shaders'
          $missing = @()
          $nolib = @()
          foreach ($src in Get-ChildItem 'Shaders/Tests' -Filter '*.slang' | Where-Object BaseName -ne 'LayoutProbe') {
            $name = $src.BaseName
            if (-not ((Test-Path (Join-Path $out "$name.dxil")) -or (Get-ChildItem $out -Filter "$name.*.dxil" -ErrorAction SilentlyContinue))) {
              $missing += $name
            }
            if (-not (Test-Path (Join-Path $out "$name.d3d12lib"))) {
              $nolib += $name
            }
          }
          if ($missing) { throw "no DXIL for: $($missing -join ', ')" }
          Write-Host "DXIL present for every Shaders/Tests shader"
          if ($nolib) { throw "no .d3d12lib for: $($nolib -join ', ')" }
          Write-Host ".d3d12lib present for every Shaders/Tests shader"
      # The pinned DXC's disassembly of the module's heap fetches and raw accesses.
      - run: python3 Tools/check_dxil.py
      # Only Windows compiles the D3D12 sources, so only it checks their layout; the macOS format job excludes them.
      - name: Find clangd
        shell: pwsh
        run: |
          $clangd = 'C:\Program Files\LLVM\bin\clangd.exe'
          if (-not (Test-Path $clangd)) {
            Write-Host "::error::$clangd is missing from the runner image"
            exit 1
          }
          & $clangd --version
          "CLANGD_PATH=$clangd" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: xmake project -k compile_commands build/compile-commands/d3d12
      # Keep these directories equal to the ones the format job excludes.
      - run: >-
          python3 Tools/check_cpp_layout.py --only Backends/D3D12 --only Tests/D3D12 --only Tests/Support/D3D12 --only Tools/D3D12Probe
          --only Benchmarks/HostWindows --only Benchmarks/NativeD3D12 --only Benchmarks/ChecksD3D12
          --compile-commands build/compile-commands/d3d12/compile_commands.json --clangd "$env:CLANGD_PATH"
      # Release with debug features mode, which enables none in Release; /WX makes the build warning-free.
      - run: xmake f -m release -y --rojorhi_backend=d3d12 --rojorhi_d3d12_debug=mode
      - run: xmake build RojoRHITests
      - run: xmake build RojoRHIBench
