name: CI
on:
  push: {branches: [main]}
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Project policy
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: |
          if [[ -n "$RANGE" ]]; then python3 Tools/check_project_policy.py --commits "$RANGE"
          else python3 Tools/check_project_policy.py; fi
      - run: python3 Tools/check_shader_imports.py
      - run: python3 Tools/check_spec.py
      - run: python3 Tools/check_vu_coverage.py
      - run: python3 -m unittest discover -s Tools/tests -v
      - run: python3 Tools/Rename/apply.py --selftest && python3 -m unittest discover -s Tools/Extract -p 'test_*.py'
  legacy:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: brew install xmake
      - uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xmake/setup.lua') }}
      - run: xmake setup
      # Some hosted images ship Xcode without the Metal toolchain the v1 shaders compile with.
      - run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - run: xmake f -m release -y --rojorhi_backend=null --ccache=n
      - run: xmake -y && xmake test RojoRHILegacyTests/unit
      # Hosted macOS has no Metal 4: compile and count the GPU cases; run them on hardware.
      - run: |
          xmake build RojoRHILegacyTests
          n=$(./build/macosx/arm64/release/rojorhi-legacy-test/RojoRHILegacyTests --list-tests "[gpu]" | \
            sed -n 's/^\([0-9][0-9]*\) matching test cases$/\1/p')
          test -n "$n" && test "$n" -gt 0
  metal4:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: brew install xmake
      - uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xmake/setup.lua') }}
      - run: xmake setup
      # The metal4 backend compiles its own kernels, so its build needs the Metal toolchain some hosted images lack.
      - run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      # A configure with no backend flag selects metal4 on macOS; the configuration file records the resolved value.
      - run: |
          xmake f -c -m debug -y --ccache=n
          grep -q '^ *rojorhi_backend = "metal4"' .xmake/*/*/xmake.conf
      - run: xmake f -m debug -y --rojorhi_backend=metal4 --ccache=n
      - run: xmake build RojoRHITests
      # Lists the cases of each tag and requires a floor, 162 for conformance so a dropped file fails;
      # no GPU case runs in this job.
      - run: |
          for tag in conformance contract metal4; do
            floor=1
            if test "$tag" = conformance; then floor=162; fi
            n=$(./build/macosx/arm64/debug/rojorhi-test/RojoRHITests --list-tests "[$tag]" | \
              sed -n 's/^\([0-9][0-9]*\) matching test cases$/\1/p')
            test -n "$n" && test "$n" -ge "$floor"
          done
      # Release must build warning-free.
      - run: xmake f -m release -y --rojorhi_backend=metal4 --ccache=n && xmake build RojoRHITests
  interface:
    strategy: {fail-fast: false, matrix: {os: [macos-26, windows-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'macOS'
        run: brew install xmake
      - if: runner.os == 'Windows'
        uses: xmake-io/github-action-setup-xmake@v1
        with: {xmake-version: latest}
      - uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xmake/setup.lua') }}
      # The layout rule runs `python3`; setup-python on Windows installs only `python.exe`,
      # so a python3 copy is added beside it when the runner has none.
      - if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command python3 -ErrorAction SilentlyContinue)) {
            $python = (Get-Command python).Source
            Copy-Item $python (Join-Path (Split-Path $python) 'python3.exe')
          }
          python3 --version
      # DXIL needs dxcompiler.dll and dxil.dll on the loader path; the Windows SDK ships both.
      # Without them the shader rule skips DXIL and says so, and the check_dxil step below fails the job.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $dir = Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64' } |
            Where-Object { (Test-Path (Join-Path $_ 'dxcompiler.dll')) -and (Test-Path (Join-Path $_ 'dxil.dll')) } |
            Select-Object -First 1
          if ($dir) {
            Add-Content $env:GITHUB_PATH $dir
            Write-Host "DXIL runtime on PATH: $dir"
          } else {
            Write-Host '::notice::dxcompiler.dll and dxil.dll not found in the Windows SDK; DXIL will be skipped'
          }
      - run: xmake setup
      # Some hosted images ship Xcode without the Metal toolchain the metallibs and shader libraries need.
      - if: runner.os == 'macOS'
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      # A configure with no backend flag selects null off macOS (is_host in xmake/targets.lua).
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          xmake f -c -m debug -y
          if (-not (Select-String -Path '.xmake/*/*/xmake.conf' -Pattern '^\s*rojorhi_backend = "null"')) { throw 'the default backend is not null' }
      - run: xmake f -m debug -y --rojorhi_backend=null
      - run: xmake build RojoRHITests
      # Without the Metal toolchain the build skips packaging and the shader library cases skip too,
      # so hosted macOS fails here instead of passing with nothing packaged.
      - if: runner.os == 'macOS'
        run: |
          header=$(find build -name ShaderList.h -path '*/rojorhi/*' | head -n 1)
          if [ -z "$header" ]; then echo "::error::no generated ShaderList.h under build/"; exit 1; fi
          if ! grep -q 'kMetalLibrariesBuilt = true;' "$header"; then
            echo "::error::$header says the Metal shader libraries were not built"; exit 1
          fi
      - run: xmake test RojoRHITests/contract
      - run: xmake test RojoRHITests/death
      - run: xmake test RojoRHITests/abi
      # The DXIL of the module's heap fetches and raw accesses; the check fails, rather than skips,
      # when the build compiled no DXIL.
      - if: runner.os == 'Windows'
        run: python3 Tools/check_dxil.py
      # The benchmark harness builds on macOS only; hosted runners have no Metal 4, so its GPU cases are counted.
      - if: runner.os == 'macOS'
        run: xmake build RojoRHIBench && xmake test RojoRHIBench/null
      - if: runner.os == 'macOS'
        run: |
          n=$(./build/macosx/arm64/debug/rojorhi-bench/RojoRHIBench check --list-tests "[native]" | \
            sed -n 's/^\([0-9][0-9]*\) matching test cases$/\1/p')
          test -n "$n" && test "$n" -gt 0
      - run: xmake f -m release -y --rojorhi_backend=null
      - run: xmake build RojoRHITests
      - run: xmake test RojoRHITests/contract
      - if: runner.os == 'macOS'
        run: xmake build RojoRHIBench && xmake test RojoRHIBench/null
      # Release links with LTO (ADR 0012); the probe shows a library entry inlined into its caller.
      - run: xmake build RojoRHILtoProbe && xmake run RojoRHILtoProbe
      - run: python3 Tools/check_lto_inline.py
  # The validation tracker's hidden stress cases under MSVC AddressSanitizer, which stands in for ThreadSanitizer there:
  # a long frame loop and every queue submitting from its own thread, Null backend, Debug so validation is on.
  tracker-stress:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: xmake-io/github-action-setup-xmake@v1
        with: {xmake-version: latest}
      - uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xmake/setup.lua') }}
      # The layout rule runs `python3`; setup-python on Windows installs only `python.exe`,
      # so a python3 copy is added beside it when the runner has none.
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - shell: pwsh
        run: |
          if (-not (Get-Command python3 -ErrorAction SilentlyContinue)) {
            $python = (Get-Command python).Source
            Copy-Item $python (Join-Path (Split-Path $python) 'python3.exe')
          }
          python3 --version
      - run: xmake setup
      - uses: ilammy/msvc-dev-cmd@v1
      # Only the project's targets are instrumented: the packages stay as they are, so the STL container annotations that
      # AddressSanitizer turns on are disabled on the targets to match them (the linker refuses mixed annotation settings).
      # The developer environment puts the AddressSanitizer runtime DLL on PATH.
      - shell: pwsh
        run: >
          xmake f -m debug -y --rojorhi_backend=null
          '--cxflags=-fsanitize=address -D_DISABLE_STRING_ANNOTATION -D_DISABLE_VECTOR_ANNOTATION -D_DISABLE_OPTIONAL_ANNOTATION'
          '--ldflags=-INCREMENTAL:NO'
      - run: xmake build RojoRHITests
      # The executable must import the AddressSanitizer runtime, or the run would pass uninstrumented.
      - shell: pwsh
        working-directory: build/windows/x64/debug/rojorhi-test
        run: |
          $out = dumpbin /dependents RojoRHITests.exe | Out-String
          if ($out -notmatch '(?i)clang_rt\.asan[\w-]*\.dll') { Write-Host $out; throw 'RojoRHITests.exe does not import the AddressSanitizer runtime' }
      # Both stress cases must be listed, or a skipped build would pass with nothing run.
      - shell: pwsh
        working-directory: build/windows/x64/debug/rojorhi-test
        run: |
          $out = .\RojoRHITests.exe --list-tests "[stress]" | Out-String
          if ($out -notmatch '(?m)^2 matching test cases') { Write-Host $out; throw 'expected 2 [stress] cases' }
      - shell: pwsh
        working-directory: build/windows/x64/debug/rojorhi-test
        run: |
          .\RojoRHITests.exe "[stress]" --durations yes
          if ($LASTEXITCODE -ne 0) { throw "stress cases exited with $LASTEXITCODE" }
  # ADR 0012: what including the public header costs a translation unit, against a stored baseline.
  header-cost:
    strategy: {fail-fast: false, matrix: {os: [macos-26, windows-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: python3 Tools/header_compile_time.py
        shell: bash
  format:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: brew install xmake clang-format
      - uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xmake/setup.lua') }}
      - run: xmake setup
      - run: xmake f -m release -y --ccache=n --rojorhi_backend=null && xmake project -k compile_commands build/compile-commands/null
      - run: xmake format --check
      - run: xmake f -m release -y --ccache=n --rojorhi_backend=metal4 && xmake project -k compile_commands build/compile-commands/metal4
      - run: xmake format --check
      - run: python3 Tools/check_rhi_headers.py
      # The D3D12 sources are compiled and checked on Windows (the d3d12 job); keep the directories equal to the ones it checks there.
      - run: |
          python3 Tools/check_cpp_layout.py --compile-commands build/compile-commands/null/compile_commands.json \
              --compile-commands build/compile-commands/metal4/compile_commands.json \
              --exclude Backends/D3D12 --exclude Tests/D3D12 --exclude Tests/Support/D3D12 --exclude Tools/D3D12Probe \
              --exclude Benchmarks/HostWindows --exclude Benchmarks/NativeD3D12 --exclude Benchmarks/ChecksD3D12
      - run: python3 Tools/check_cpp_comments.py --public-api-docs error --compile-commands build/compile-commands/null/compile_commands.json
      - run: python3 Tools/check_cpp_comments.py --public-api-docs error --compile-commands build/compile-commands/metal4/compile_commands.json
  # The floor probe gates the D3D12 backend (ADR 0010): WARP on the hosted image must meet the hardware floor
  # through the app-local Agility SDK and WARP, by a device factory or by the SDK exports.
  d3d12:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: xmake-io/github-action-setup-xmake@v1
        with: {xmake-version: latest}
      - uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xmake/setup.lua') }}
      # The layout check runs `python3`; setup-python on Windows installs only `python.exe`.
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - shell: pwsh
        run: |
          if (-not (Get-Command python3 -ErrorAction SilentlyContinue)) {
            $python = (Get-Command python).Source
            Copy-Item $python (Join-Path (Split-Path $python) 'python3.exe')
          }
          python3 --version
      - run: xmake setup
      - run: xmake f -m debug -y --rojorhi_backend=d3d12 --rojorhi_d3d12_adapter=warp --rojorhi_d3d12_debug=gbv
      - run: xmake build RojoRHID3D12ProbeFactory
      - run: xmake build RojoRHID3D12ProbeExports
      # Each probe prints one JSON object and exits 0 only when the floor is met on the app-local WARP; the gate
      # requires the factory variant to exit 0 (the backend creates devices through the factory), the exports
      # variant's exit code is informational, and an unparsable report fails it. The fsr section, whether the
      # FidelityFX upscaler loads on WARP with and without GPU-based validation and runs without it (the dispatch is
      # skipped under it, with the reason in fsr.dispatchSkipped), is reported and gates nothing.
      - name: Probe the D3D12 floor
        shell: pwsh
        run: |
          $dir = 'build/windows/x64/debug/rojorhi-d3d12-probe'
          Get-ChildItem -Recurse $dir -Include *.exe, *.dll | ForEach-Object { Write-Host $_.FullName }
          foreach ($dll in 'D3D12/D3D12Core.dll', 'D3D12/d3d12SDKLayers.dll', 'd3d10warp.dll') {
            if (-not (Test-Path (Join-Path $dir $dll))) { throw "$dll is missing from $dir" }
          }
          $out = New-Item -ItemType Directory -Force 'build/d3d12-probe'
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $executables = [ordered]@{ factory = 'RojoRHID3D12ProbeFactory.exe'; exports = 'RojoRHID3D12ProbeExports.exe' }
          $variants = @($executables.Keys)
          $codes = @{}
          $parsed = @{}
          $failed = @()
          foreach ($name in $variants) {
            $exe = Join-Path $dir $executables[$name]
            $json = Join-Path $out "probe-$name.json"
            & $exe > $json
            $codes[$name] = $LASTEXITCODE
            Write-Host "probe-$name.json (exit $($codes[$name])):"
            Get-Content $json
          }
          foreach ($name in $variants) {
            try {
              $parsed[$name] = Get-Content -Raw (Join-Path $out "probe-$name.json") | ConvertFrom-Json -ErrorAction Stop
              if ($null -eq $parsed[$name]) { $failed += "probe-$name.json is empty" }
            } catch {
              $failed += "probe-$name.json is not valid JSON: $_"
            }
          }
          $fields = [ordered]@{
            'floor met'                     = { $args[0].floor.met }
            'floor missing'                 = { $args[0].floor.missing -join ', ' }
            'device created'                = { $args[0].device.created }
            'max feature level'             = { $args[0].features.maxFeatureLevel }
            'highest shader model'          = { $args[0].features.highestShaderModel }
            'resource binding tier'         = { $args[0].features.resourceBindingTier }
            'typed UAV load formats'        = { $args[0].features.typedUavLoadAdditionalFormats }
            'enhanced barriers'             = { $args[0].features.enhancedBarriersSupported }
            'dynamic depth bias'            = { $args[0].features.dynamicDepthBiasSupported }
            'resource heap tier'            = { $args[0].features.resourceHeapTier }
            'Agility method, SDK path'      = { "$($args[0].agility.method) $($args[0].agility.sdkPath)" }
            'D3D12Core app-local, version'  = { "$($args[0].agility.appLocal) $($args[0].agility.fileVersion)" }
            'WARP app-local, version'       = { "$($args[0].warp.appLocal) $($args[0].warp.fileVersion)" }
            'debug layer active'            = { $args[0].debug.layerActive }
            'GBV requested'                 = { $args[0].debug.gbvRequested }
            'DRED active'                   = { $args[0].debug.dredActive }
            'InfoQueue1 callback'           = { $args[0].debug.infoQueue1Callback }
            'raw view 2^27, 2^27+1 error'   = { "$($args[0].rawView.elements2p27Error), $($args[0].rawView.elements2p27plus1Error)" }
            'acquired, presented'           = { "$($args[0].present.acquired), $($args[0].present.presented)" }
            'OPTIONS19 max view heap'       = { $args[0].features.options19.maxViewDescriptorHeapSize }
            'largest view heap'             = { $args[0].features.largestViewHeap }
            'FSR loaded, version'           = { "$($args[0].fsr.loaded) $($args[0].fsr.version)" }
            'FSR context, dispatch, output' = { "$($args[0].fsr.contextCreated), $(if ($args[0].fsr.dispatchSkipped) { 'skipped' } else { $args[0].fsr.dispatched }), $($args[0].fsr.outputNonZero)" }
            'FSR layer messages'            = { "$(@($args[0].fsr.layerMessages).Count) $($args[0].fsr.error)" }
            'FSR no GBV: device, context, dispatch, output' = { "$($args[0].fsr.noGbv.device.created), $($args[0].fsr.noGbv.contextCreated), $($args[0].fsr.noGbv.dispatched), $($args[0].fsr.noGbv.outputNonZero)" }
            'FSR no GBV: layer messages'    = { "$(@($args[0].fsr.noGbv.layerMessages).Count) $($args[0].fsr.noGbv.error)" }
          }
          $summary = @('## D3D12 floor probe (WARP)', '', '| | factory | exports |', '|---|---|---|')
          $summary += "| exit code | $($codes['factory']) | $($codes['exports']) |"
          foreach ($label in $fields.Keys) {
            $cells = foreach ($name in $variants) {
              if ($null -ne $parsed[$name]) { "$(& $fields[$label] $parsed[$name])" } else { 'no report' }
            }
            $summary += "| $label | $($cells -join ' | ') |"
          }
          $summary -join "`n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          foreach ($message in $failed) { Write-Host "::error::$message" }
          if ($failed.Count -gt 0) { exit 1 }
          Write-Host "exports variant exit code (informational): $($codes['exports'])"
          if ($codes['factory'] -ne 0) {
            Write-Host "::error::the factory variant did not meet the floor on the app-local WARP: it exited $($codes['factory'])"
            exit 1
          }
          exit 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3d12-probe
          path: build/d3d12-probe/
      - run: xmake build RojoRHITests
      # Every conformance shader has DXIL (the layout probe is no conformance shader: xmake/slang.lua
      # leaves slang.layout_probe files out of the shaders it compiles). The check is per source file, best effort for
      # shaders with several entries: <name>.dxil, or <name>.<entry>.dxil for each entry of several. Each shader
      # also has its <name>.d3d12lib.
      - shell: pwsh
        run: |
          $out = 'build/windows/x64/debug/rojorhi-test/Shaders'
          $missing = @()
          $nolib = @()
          foreach ($src in Get-ChildItem 'Shaders/Tests' -Filter '*.slang' | Where-Object BaseName -ne 'LayoutProbe') {
            $name = $src.BaseName
            if (-not ((Test-Path (Join-Path $out "$name.dxil")) -or (Get-ChildItem $out -Filter "$name.*.dxil" -ErrorAction SilentlyContinue))) {
              $missing += $name
            }
            if (-not (Test-Path (Join-Path $out "$name.d3d12lib"))) {
              $nolib += $name
            }
          }
          if ($missing) { throw "no DXIL for: $($missing -join ', ')" }
          Write-Host "DXIL present for every Shaders/Tests shader"
          if ($nolib) { throw "no .d3d12lib for: $($nolib -join ', ')" }
          Write-Host ".d3d12lib present for every Shaders/Tests shader"
      # The runtime rule copies the app-local Agility SDK and WARP beside the test executable.
      - shell: pwsh
        run: |
          $dir = 'build/windows/x64/debug/rojorhi-test'
          foreach ($dll in 'D3D12/D3D12Core.dll', 'D3D12/d3d12SDKLayers.dll', 'd3d10warp.dll') {
            if (-not (Test-Path (Join-Path $dir $dll))) { throw "$dll is missing from $dir" }
          }
      - id: debug_abi
        run: xmake test RojoRHITests/abi
        timeout-minutes: 15
      # The pinned DXC's disassembly of the module's heap fetches and raw accesses.
      - run: python3 Tools/check_dxil.py
      - id: debug_contract
        run: xmake test RojoRHITests/contract
        timeout-minutes: 15
      - id: debug_death
        run: xmake test RojoRHITests/death
        timeout-minutes: 15
      - id: debug_conformance
        run: xmake test RojoRHITests/conformance
        timeout-minutes: 15
      # Lists the cases of each tag and requires a floor, so a dropped file fails. The floors are the case counts
      # at this commit; they rise as cases are added.
      - name: Count the cases
        shell: pwsh
        run: |
          $exe = 'build/windows/x64/debug/rojorhi-test/RojoRHITests.exe'
          $floors = [ordered]@{ conformance = 173; d3d12 = 255; contract = 878 }
          foreach ($tag in $floors.Keys) {
            $out = & $exe --list-tests "[$tag]" | Out-String
            if ($out -notmatch '(\d+) matching test cases') { throw "no case count for [$tag]" }
            $n = [int]$Matches[1]
            Write-Host "[$tag]: $n cases, floor $($floors[$tag])"
            if ($n -lt $floors[$tag]) { throw "[$tag] lists $n cases, below its floor $($floors[$tag])" }
          }
      # The toolchain record: the cl command lines xmake writes for the c++23 language level, the MSVC version, and
      # whether this MSVC accepts each spelling of that level (a D9002 warning means it does not).
      - name: Record the toolchain
        shell: pwsh
        run: |
          xmake --version
          xmake build -r -v RojoRHID3D12ProbeFactory
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products * -property installationPath
          $version = (Get-Content (Join-Path $install 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt')).Trim()
          $cl = Join-Path $install "VC\Tools\MSVC\$version\bin\Hostx64\x64\cl.exe"
          Write-Host "MSVC tools $version at $cl"
          & $cl 2>&1 | Select-Object -First 2 | ForEach-Object { Write-Host "$_" }
          $source = Join-Path $env:RUNNER_TEMP 'language-level.cpp'
          Set-Content -Path $source -Value 'int main() {}' -Encoding ascii
          foreach ($flag in '/std:c++23', '/std:c++23preview', '/std:c++latest') {
            Write-Host "cl /nologo /Zs $flag"
            & $cl /nologo /Zs $flag $source 2>&1 | ForEach-Object { Write-Host "  $_" }
            Write-Host "  exit $LASTEXITCODE"
          }
          exit 0
      # Only Windows compiles the D3D12 sources, so only it checks their layout; the macOS format job excludes them.
      - name: Find clangd
        shell: pwsh
        run: |
          $clangd = 'C:\Program Files\LLVM\bin\clangd.exe'
          if (-not (Test-Path $clangd)) {
            Write-Host "::error::$clangd is missing from the runner image"
            exit 1
          }
          & $clangd --version
          "CLANGD_PATH=$clangd" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: xmake project -k compile_commands build/compile-commands/d3d12
      # Keep these directories equal to the ones the format job excludes.
      - run: >-
          python3 Tools/check_cpp_layout.py --only Backends/D3D12 --only Tests/D3D12 --only Tests/Support/D3D12 --only Tools/D3D12Probe
          --only Benchmarks/HostWindows --only Benchmarks/NativeD3D12 --only Benchmarks/ChecksD3D12
          --compile-commands build/compile-commands/d3d12/compile_commands.json --clangd "$env:CLANGD_PATH"
      # Release with debug features mode, which enables none in Release; /WX makes the build warning-free. The LTO
      # probe only builds and is not run, and check_lto_inline.py disassembles it to require that link-time
      # optimization inlined Device::capabilities into its caller (ADR 0012).
      - run: xmake f -m release -y --rojorhi_backend=d3d12 --rojorhi_d3d12_adapter=warp --rojorhi_d3d12_debug=mode
      - run: xmake build RojoRHITests
      - id: release_contract
        run: xmake test RojoRHITests/contract
        timeout-minutes: 15
      - id: release_conformance
        run: xmake test RojoRHITests/conformance
        timeout-minutes: 15
      - run: xmake build RojoRHILtoProbe
      - run: python3 Tools/check_lto_inline.py
      # Debug with the debug layer alone, under which WARP completes the FidelityFX dispatch it never completes under
      # GPU-based validation: the files and cases that the configuration above leaves out or skips because they submit
      # upscales run here, so their checks for layer messages see a layer. Its own build directory keeps the GBV build.
      - run: xmake f -m debug -y -o build/layer --rojorhi_backend=d3d12 --rojorhi_d3d12_adapter=warp --rojorhi_d3d12_debug=layer
      - run: xmake build RojoRHITests
      - id: layer_upscale
        shell: pwsh
        timeout-minutes: 15
        working-directory: build/layer/windows/x64/debug/rojorhi-test
        run: |
          .\RojoRHITests.exe --warn UnmatchedTestSpec -# $env:UPSCALE_CASES
          if ($LASTEXITCODE -ne 0) { exit 1 }
        env:
          UPSCALE_CASES: '[#UpscalerTests]~[death],[#UpscaleConformanceTests],[#D3D12UpscalerTests]~[death],[#DiagnosticsTests]~[death],[#TrackerTests]~[death],[#ScopeConformanceTests]'
      # After a failed test step, its entry runs again one case per process, so a case that ends the Catch2 process (an
      # abort, a hang, a removed device) is still named: a PASS, SKIP or FAIL line for each case, and for each failing
      # case its exit code, the error and assertion lines and the last lines of its output.
      - name: Run each case of the failed entry alone
        if: failure()
        shell: pwsh
        timeout-minutes: 25
        env:
          UPSCALE_CASES: '[#UpscalerTests]~[death],[#UpscaleConformanceTests],[#D3D12UpscalerTests]~[death],[#DiagnosticsTests]~[death],[#TrackerTests]~[death],[#ScopeConformanceTests]'
        run: |
          $entries = @(
            @{ label = 'Debug abi'; outcome = '${{ steps.debug_abi.outcome }}'; mode = 'debug'; filter = '[abi]' }
            @{ label = 'Debug contract'; outcome = '${{ steps.debug_contract.outcome }}'; mode = 'debug'; filter = '[contract]~[death],[d3d12]~[death]' }
            @{ label = 'Debug death'; outcome = '${{ steps.debug_death.outcome }}'; mode = 'debug'; filter = '[death]' }
            @{ label = 'Debug conformance'; outcome = '${{ steps.debug_conformance.outcome }}'; mode = 'debug'; filter = '[conformance]' }
            @{ label = 'Release contract'; outcome = '${{ steps.release_contract.outcome }}'; mode = 'release'; filter = '[contract]~[death],[d3d12]~[death]' }
            @{ label = 'Release conformance'; outcome = '${{ steps.release_conformance.outcome }}'; mode = 'release'; filter = '[conformance]' }
            @{ label = 'Debug layer upscale'; outcome = '${{ steps.layer_upscale.outcome }}'; dir = 'build/layer/windows/x64/debug/rojorhi-test'; filter = $env:UPSCALE_CASES }
          )
          $failed = @($entries | Where-Object { $_.outcome -eq 'failure' })
          if ($failed.Count -eq 0) { Write-Host 'No test step failed, so no entry runs again.'; exit 0 }
          $wanted = '\[RHI\] \[error\]|D3D12 (ERROR|CORRUPTION)|STATE_|EXECUTION|FAILED|REQUIRE|CHECK|unexpected exception|fatal error'
          $spec = Join-Path $env:RUNNER_TEMP 'case.txt'
          $out = Join-Path $env:RUNNER_TEMP 'case.log'
          $summary = @()
          foreach ($entry in $failed) {
            $dir = if ($entry.dir) { $entry.dir } else { "build/windows/x64/$($entry.mode)/rojorhi-test" }
            Push-Location $dir
            $names = @(& .\RojoRHITests.exe -# $entry.filter --list-tests --verbosity quiet | Where-Object { $_.Trim() -ne '' })
            Write-Host "$($entry.label): $($names.Count) cases, each in its own process"
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $failures = @()
            $ran = 0
            foreach ($name in $names) {
              if ($clock.Elapsed.TotalSeconds -gt 1080) {
                Write-Host "::warning::$($entry.label) stopped after $ran of $($names.Count) cases: its time budget ran out"
                break
              }
              $ran++
              # One test spec per line of the input file, with the characters Catch2 treats specially escaped.
              $escaped = [regex]::Replace($name, '[,\[\]"\\*]', '\$0')
              if ($escaped.StartsWith('~')) { $escaped = '\' + $escaped }
              Set-Content -Path $spec -Value $escaped -Encoding utf8NoBOM
              $p = Start-Process -FilePath cmd.exe -ArgumentList "/d /c RojoRHITests.exe -# -f `"$spec`" > `"$out`" 2>&1" -WorkingDirectory $PWD -NoNewWindow -PassThru
              $null = $p.Handle
              if ($p.WaitForExit(120000)) {
                $p.WaitForExit()
                $code = $p.ExitCode
              } else {
                & taskkill /PID $p.Id /T /F | Out-Null
                $code = 'timeout after 120 s'
              }
              # Catch2 exits 4 when its one case skipped.
              if ("$code" -eq '0') { Write-Host "PASS: $name"; continue }
              if ("$code" -eq '4') { Write-Host "SKIP: $name"; continue }
              $failures += "$name ($code)"
              Write-Host "FAIL ($code): $name"
              $lines = @(Get-Content $out | Where-Object { $_ -notmatch 'Live\s+Object' })
              $lines | Where-Object { $_ -match $wanted } | Select-Object -First 30 | ForEach-Object { Write-Host "  $_" }
              Write-Host '  last lines:'
              $lines | Select-Object -Last 20 | ForEach-Object { Write-Host "    $_" }
            }
            Pop-Location
            Write-Host "$($entry.label): $($failures.Count) of $ran cases failed on their own ($([int]$clock.Elapsed.TotalSeconds) s)"
            $summary += "### $($entry.label): $($failures.Count) of $ran cases failed on their own"
            $summary += ''
            $summary += $failures | ForEach-Object { "- $_" }
          }
          $summary -join "`n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit 1
  # The benchmark harness on D3D12 (WARP): the Windows host layer, the native arm's context and the checks of both, built
  # warning-free in Debug with the debug layer and in Release with no debug feature. It never times anything (ADR 0014).
  d3d12-bench:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: xmake-io/github-action-setup-xmake@v1
        with: {xmake-version: latest}
      - uses: actions/cache@v5
        with:
          path: ThirdParty
          key: ${{ runner.os }}-thirdparty-${{ hashFiles('xmake/setup.lua') }}
      # The shader rules run `python3`; setup-python on Windows installs only `python.exe`.
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - shell: pwsh
        run: |
          if (-not (Get-Command python3 -ErrorAction SilentlyContinue)) {
            $python = (Get-Command python).Source
            Copy-Item $python (Join-Path (Split-Path $python) 'python3.exe')
          }
          python3 --version
      - run: xmake setup
      - run: xmake f -m debug -y --rojorhi_backend=d3d12 --rojorhi_d3d12_adapter=warp --rojorhi_d3d12_debug=layer
      - run: xmake build RojoRHIBench
      - run: xmake test RojoRHIBench/host
        timeout-minutes: 5
      - run: xmake test RojoRHIBench/native
        timeout-minutes: 10
      - run: xmake test RojoRHIBench/d3d12
        timeout-minutes: 5
      - run: xmake f -m release -y --rojorhi_backend=d3d12 --rojorhi_d3d12_adapter=warp --rojorhi_d3d12_debug=mode
      - run: xmake build RojoRHIBench
      - run: xmake test RojoRHIBench/host
        timeout-minutes: 5
      # The driver builds both modes itself and copies each with its runtime; the date is fixed once so the summary's path is known.
      - shell: pwsh
        run: '"BENCH_DATE=$(Get-Date -Format yyyy-MM-dd)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV'
      - run: python3 Tools/bench.py --root build/bench-evidence --topic t2-gate-d3d12 --date ${{ env.BENCH_DATE }} build --backend d3d12 --adapter warp
        timeout-minutes: 15
      # The workload list is joined to its flag with an equals sign: the layout test reads every flag followed by a space as a directory.
      - run: python3 Tools/bench.py --root build/bench-evidence --topic t2-gate-d3d12 --date ${{ env.BENCH_DATE }} correctness --only=C1,C2,C3,C4,C5,C6,C7,C8,C9,C10,G1,G2
        timeout-minutes: 30
      # The gate passes only when every selected workload was compared and passed.
      - shell: pwsh
        run: |
          $summary = Get-Content "build/bench-evidence/t2-gate-d3d12/$env:BENCH_DATE/correctness/summary.json" -Raw | ConvertFrom-Json
          $failed = 0
          foreach ($workload in 'C1','C2','C3','C4','C5','C6','C7','C8','C9','C10','G1','G2') {
            $entry = $summary.$workload
            if ($null -eq $entry -or $entry.passed -ne $true -or $entry.gate -ne 'compared') {
              Write-Host "::error::$workload did not pass the gate: $($entry | ConvertTo-Json -Compress)"
              $failed++
            }
          }
          if ($failed -gt 0) { exit 1 }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3d12-bench-gate
          path: build/bench-evidence/
